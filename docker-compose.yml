services:

  # ── API Gateway ──────────────────────────────────────────────────────────────
  apigateway:
    image: ${DOCKER_REGISTRY-}apigateway
    build:
      context: .
      dockerfile: API Gateway/Dockerfile

  # ── Auth Service ─────────────────────────────────────────────────────────────
  authservice:
    image: ${DOCKER_REGISTRY-}authservice
    build:
      context: .                            # build context = repo root (parent of AuthService/)
      dockerfile: AuthService/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy          # wait for SQL Server to pass its health check

  # ── Catalog Service ──────────────────────────────────────────────────────────
  catalogservice:
    image: ${DOCKER_REGISTRY-}catalogservice
    build:
      context: .                            # build context = repo root (parent of Catalog Service/)
      dockerfile: Catalog Service/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy          # wait for SQL Server to pass its health check

  # ── SQL Server 2022 ──────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql      # persist database files across restarts
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P \"${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s                    # give SQL Server time to initialise on first boot

volumes:
  sqlserver_data:
